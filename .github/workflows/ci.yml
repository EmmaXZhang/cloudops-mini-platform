name: CloudOps CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    name: Test, build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run automated tests
        run: pytest -q app/tests

      - name: Build Docker image
        run: docker build -t cloudops-mini-platform:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d \
            --name cloudops-ci \
            -p 18080:8080 \
            -e ENVIRONMENT=github-actions \
            cloudops-mini-platform:${{ github.sha }}

      - name: Smoke test health endpoint
        run: |
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              echo
              echo "Container health check passed"
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/20"
            sleep 2
          done

          echo "Container failed its smoke test"
          docker logs cloudops-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs cloudops-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f cloudops-ci || true

  aws-auth:
    name: Authenticate to AWS using OIDC
    needs: test-build-smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: cloudops-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity
