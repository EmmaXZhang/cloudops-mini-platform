
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-smoke:
    name: Test, build, smoke test and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run automated tests
        run: pytest -q app/tests

      - name: Build Docker image
        run: docker build -t cloudops-mini-platform:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d \
            --name cloudops-ci \
            -p 18080:8080 \
            -e ENVIRONMENT=github-actions \
            cloudops-mini-platform:${{ github.sha }}

      - name: Smoke test health endpoint
        run: |
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              echo
              echo "Container health check passed"
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/20"
            sleep 2
          done

          echo "Container failed its smoke test"
          docker logs cloudops-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs cloudops-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f cloudops-ci || true

      - name: Configure temporary AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/github-actions-cicd-practice'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: cloudops-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/github-actions-cicd-practice'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push tested image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/github-actions-cicd-practice'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cloudops-mini-platform
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            cloudops-mini-platform:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          docker tag \
            cloudops-mini-platform:${IMAGE_TAG} \
            ${REGISTRY}/${REPOSITORY}:latest

          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:latest
